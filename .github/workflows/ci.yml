name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore WordLoop.sln
      - run: dotnet build WordLoop.sln -c Release --no-restore
      - run: dotnet test WordLoop.sln -c Release --no-build
