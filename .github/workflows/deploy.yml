name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Project site lives under https://<user>.github.io/<repo>/
  BASE_HREF: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/WordLoop.Web/WordLoop.Web.csproj -c Release -o publish

      - name: Prepare for GitHub Pages
        working-directory: publish/wwwroot
        run: |
          # Rewrite <base href="/"> to the project path; fail if the tag was not found.
          sed -i "s|<base href=\"/\" />|<base href=\"${BASE_HREF}\" />|" index.html
          grep -q "<base href=\"${BASE_HREF}\" />" index.html
          # SPA routes: Pages serves 404.html for unknown paths, Blazor then routes client-side.
          cp index.html 404.html
          # Without this Jekyll skips folders starting with "_" (i.e. _framework).
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
